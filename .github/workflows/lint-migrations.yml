name: Test and lint migrations

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/lint-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Fast DDL & Syntax Verification (Vanilla PostgreSQL 17 Container)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate migration file naming convention
        run: |
          set -euo pipefail
          invalid=0
          for f in supabase/migrations/*.sql; do
            [ -e "$f" ] || continue
            filename=$(basename "$f")
            if [[ ! "$filename" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "::error::Invalid migration filename: $filename (must match YYYYMMDDHHMMSS_name.sql)"
              invalid=1
            fi
          done
          [ "$invalid" -eq 0 ] || exit 1

      - name: Scan for destructive DDL operations
        id: destructive-check
        run: |
          set -euo pipefail
          echo "Scanning migrations for destructive DDL operations..."
          destructive_ops=""
          for f in supabase/migrations/*.sql; do
            [ -e "$f" ] || continue
            filename=$(basename "$f")
            for pattern in 'DROP TABLE' 'DROP COLUMN' 'TRUNCATE' 'DROP SCHEMA' 'DROP DATABASE'; do
              if grep -qiE "^[[:space:]]*${pattern}" "$f"; then
                matches=$(grep -n -iE "^[[:space:]]*${pattern}" "$f" | awk '{print "Line " $0}')
                destructive_ops="${destructive_ops}File: ${filename}\n${matches}\n"
                echo "::warning file=$f::Destructive DDL detected: '${pattern}' in $filename"
              fi
            done
          done

          if [ -n "$destructive_ops" ]; then
            {
              echo "### Destructive DDL Warning"
              echo ""
              echo "> Warning: Destructive operations were detected in migration files. Ensure peer review and data backup before deployment:"
              echo '```'
              printf '%b' "$destructive_ops"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No destructive DDL operations detected."
          fi

      - name: Execute migration lifecycle integration test suite
        id: lifecycle-test
        run: |
          set -euo pipefail
          chmod +x scripts/test_local_migrations.sh
          ./scripts/test_local_migrations.sh

      - name: Write lint job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Fast DDL & Syntax Verification (Vanilla PostgreSQL 17 Container)"
            echo ""
            echo "| Test Dimension | Implementation | Fidelity |"
            echo "|---|---|---|"
            echo "| Runtime Environment | Ephemeral \`postgres:17-alpine\` Docker container | Vanilla PostgreSQL 17 |"
            echo "| Filename Syntax | \`YYYYMMDDHHMMSS_name.sql\` format check | Standardized |"
            echo "| Destructive DDL | \`DROP TABLE\`, \`DROP COLUMN\`, \`TRUNCATE\` scanner | Safety Guard |"
            echo "| Migration Lifecycle | Clean init, DDL apply, seed, rollback test | Integration Verified |"
            echo "| Role Scaffolding | Stubbed roles (\`anon\`, \`authenticated\`, \`service_role\`) | DDL & Grant syntax |"
            echo "| Scope Boundary | Fast raw PostgreSQL syntax/DDL verification | *Excludes live GoTrue/PostgREST* |"
          } >> "$GITHUB_STEP_SUMMARY"
