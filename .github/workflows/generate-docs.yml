name: Generate database schema documentation

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/generate_schema_docs.py'
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: supabase-generate-docs
  cancel-in-progress: false

jobs:
  docs:
    name: Generate Markdown documentation and Mermaid ER diagram
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - name: Start isolated PostgreSQL test instance
        run: |
          set -euo pipefail
          chmod +x scripts/init_test_pg.sh
          ./scripts/init_test_pg.sh pg-doc-target 5436

      - name: Apply migrations sequentially
        run: |
          set -euo pipefail
          for f in $(ls supabase/migrations/*.sql 2>/dev/null | sort); do
            [ -e "$f" ] || continue
            echo "Applying: $f"
            docker exec -i pg-doc-target psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$f"
          done
          echo "All migrations applied."

      - name: Generate schema documentation and ER diagram
        run: |
          set -euo pipefail
          mkdir -p docs
          python3 scripts/generate_schema_docs.py pg-doc-target docs/schema.md
          if [ ! -s docs/schema.md ]; then
            echo "::error::Generated documentation file docs/schema.md is empty."
            exit 1
          fi
          echo "Generated docs/schema.md ($(wc -l < docs/schema.md) lines)"

      - name: Stop and remove test container
        if: always()
        run: |
          set -euo pipefail
          docker stop pg-doc-target >/dev/null 2>&1 || true
          docker rm pg-doc-target >/dev/null 2>&1 || true

      - name: Upload documentation artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: database-schema-docs-${{ github.sha }}
          path: docs/schema.md
          retention-days: 30

      - name: Commit updated documentation if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/schema.md
          if git diff --cached --quiet; then
            echo "Documentation is already up-to-date. Nothing to commit."
            exit 0
          fi
          git commit -m "docs(schema): update database schema docs and ER diagram"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Publish documentation summary
        run: |
          set -euo pipefail
          {
            echo "## Schema Documentation Generated"
            echo ""
            echo "Living database schema documentation and ER diagrams updated."
            echo ""
            cat docs/schema.md
          } >> "$GITHUB_STEP_SUMMARY"
