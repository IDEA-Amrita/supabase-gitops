name: Scheduled schema drift alert

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    name: Check for uncaptured schema drift
    if: github.event_name != 'schedule' || vars.ENABLE_ALL_SCHEDULES == 'true' || vars.ENABLE_SCHEDULED_DRIFT_ALERTS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.121.0

      - name: Inspect migration status
        id: check
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not configured."
            exit 1
          fi

          echo "Inspecting schema drift via supabase db pull --declarative..."
          set +e
          pull_output=$(supabase db pull --declarative --db-url "$SUPABASE_DB_URL" 2>&1)
          pull_exit=$?
          set -e

          printf '%s\n' "$pull_output"

          if [ "$pull_exit" -ne 0 ]; then
            echo "::error::supabase db pull command failed with exit code $pull_exit."
            {
              echo "## Workflow Infrastructure Error"
              echo ""
              echo "Failed to inspect database schema drift. The command \`supabase db pull\` returned exit code $pull_exit:"
              echo '```'
              echo "$pull_output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$pull_exit"
          fi

          if echo "$pull_output" | grep -qi "No schema changes found"; then
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
            echo "No schema drift detected. Remote matches local migrations."
          else
            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Uncaptured schema drift detected between remote Supabase database and repository migrations!"
          fi

      - name: Notify on drift
        if: steps.check.outputs.drift_detected == 'true'
        run: |
          set -euo pipefail
          {
            echo "## Schema Drift Detected"
            echo ""
            echo "Changes were detected in your remote Supabase database that are not yet committed as migration files."
            echo ""
            echo "To capture these changes into a version-controlled migration file, run the **Capture database migrations** workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report sync status
        if: steps.check.outputs.drift_detected == 'false'
        run: |
          set -euo pipefail
          {
            echo "## Schema In Sync"
            echo ""
            echo "No schema drift detected. The remote database schema matches the local migrations."
          } >> "$GITHUB_STEP_SUMMARY"
