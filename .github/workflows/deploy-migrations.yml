name: Deploy database migrations

on:
  push:
    branches:
      - master
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      confirm:
        description: >
          Type "deploy" to confirm you want to apply pending migrations to the
          production Supabase database. Review the preview job output first.
        required: false
        type: string
        default: ""
      repair_action:
        description: 'Optional: Repair migration history table before pre-flight audit'
        required: false
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'reverted'
          - 'applied'
      repair_versions:
        description: 'Space-separated migration versions to repair (e.g. "20261019000000 20261019120000")'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  preview:
    name: Preview pending migrations
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/test/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.121.0

      - name: Validate migration file naming and sequence
        run: |
          set -euo pipefail
          echo "Validating migration filenames and monotonic sequence..."
          prev_timestamp=""
          for f in supabase/migrations/*.sql; do
            [ -e "$f" ] || continue
            filename=$(basename "$f")
            if [[ ! "$filename" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "::error::Invalid migration filename: $filename (must match YYYYMMDDHHMMSS_name.sql)"
              exit 1
            fi
            curr_timestamp=$(echo "$filename" | grep -oP '^\d{14}')
            if [ -n "$prev_timestamp" ] && [ "$curr_timestamp" -le "$prev_timestamp" ]; then
              echo "::error::Non-monotonic migration timestamp detected: $filename ($curr_timestamp) is not strictly after $prev_timestamp"
              exit 1
            fi
            prev_timestamp="$curr_timestamp"
          done
          echo "Migration sequence validation passed."

      - name: Repair remote migration history (if requested)
        if: inputs.repair_action != 'none' && inputs.repair_versions != ''
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo "Executing migration repair against remote database..."
          echo "Status: ${{ inputs.repair_action }}"
          echo "Versions: ${{ inputs.repair_versions }}"
          for version in ${{ inputs.repair_versions }}; do
            supabase migration repair --db-url "$SUPABASE_DB_URL" --status "${{ inputs.repair_action }}" "$version"
          done
          echo "Remote migration history successfully repaired."

      - name: Pre-deployment remote migration history audit
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo "Auditing remote migration history against local repository..."

          local_versions=$(
            ls supabase/migrations/*.sql 2>/dev/null \
              | xargs -r -I{} basename {} \
              | grep -oP '^\d{14}' \
              | sort -u \
            || true
          )

          set +e
          raw_migration_list=$(supabase migration list --db-url "$SUPABASE_DB_URL" 2>&1)
          list_exit=$?
          set -e

          if [ "$list_exit" -ne 0 ]; then
            echo "::error::Failed to query remote migration history via supabase migration list."
            echo "$raw_migration_list"
            exit "$list_exit"
          fi

          remote_versions=$(
            tr -d '`' <<< "$raw_migration_list" \
              | awk -F'|' '
                NF >= 2 {
                  remote = $2
                  gsub(/^[ \t]+|[ \t]+$/, "", remote)
                  if (remote ~ /^[0-9]{14}$/) print remote
                }
              ' \
              | sort -u \
            || true
          )

          missing_locally=$(comm -13 <(echo "$local_versions") <(echo "$remote_versions") || true)

          if [ -n "$missing_locally" ]; then
            echo "::error::Mismatched History: Remote database contains applied migrations absent from local Git repository!"
            echo "The following remote versions have no corresponding local migration file:"
            printf '%s\n' "$missing_locally"
            {
              echo "### Pre-deployment History Audit Failed"
              echo ""
              echo "The remote database contains migrations that do not exist in \`supabase/migrations/\`:"
              echo '```'
              printf '%s\n' "$missing_locally"
              echo '```'
              echo ""
              echo "To prevent accidental schema overwrites, deployment is blocked."
              echo "Reconcile local repository or use \`supabase migration repair --status reverted <VERSION>\` before deploying."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Migration history audit passed: All applied remote versions exist in local repository."

      - name: Preview pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run | tee /tmp/preview.txt
          {
            echo "### Pending migrations"
            echo '```'
            cat /tmp/preview.txt
            echo '```'
            echo ""
            if grep -q "No migrations to apply" /tmp/preview.txt 2>/dev/null; then
              echo "> Nothing to deploy. All local migrations are already applied."
            else
              echo "> To apply, re-trigger this workflow and type **deploy** in the confirm field (or set AUTO_DEPLOY variable)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Apply migrations to production
    needs: preview
    if: >
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/test/')) &&
      (inputs.confirm == 'deploy' || (github.event_name == 'push' && vars.AUTO_DEPLOY == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.121.0

      - name: Back up remote schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo "Creating pre-migration safety schema backup..."
          supabase db dump --db-url "$SUPABASE_DB_URL" -f /tmp/backup_schema.sql

          if [ ! -s /tmp/backup_schema.sql ]; then
            echo "::error::Pre-migration schema backup is empty! Deployment aborted for safety."
            exit 1
          fi

          LINE_COUNT=$(wc -l < /tmp/backup_schema.sql)
          echo "Schema backup verified: /tmp/backup_schema.sql ($LINE_COUNT lines)"

      - name: Upload pre-migration schema backup
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: pre-migration-backup-${{ github.run_id }}
          path: /tmp/backup_schema.sql
          retention-days: 30

      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL" --yes

      - name: Verify applied migrations
        id: verify
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          supabase migration list --db-url "$SUPABASE_DB_URL" | tee /tmp/migration_state.txt

          {
            echo "migration_list<<ENDOFVAL"
            cat /tmp/migration_state.txt
            echo "ENDOFVAL"
          } >> "$GITHUB_OUTPUT"

      - name: Auto-sync TypeScript types
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p types
          supabase gen types --lang=typescript --db-url "$SUPABASE_DB_URL" --schema public > types/database.types.ts
          echo "Generated types/database.types.ts ($(wc -l < types/database.types.ts) lines)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add types/database.types.ts
          if git diff --cached --quiet; then
            echo "TypeScript types are already up-to-date."
          else
            git commit -m "chore(types): auto-sync database.types.ts after deployment"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
            echo "Successfully committed and pushed updated TypeScript types."
          fi

      - name: Write job summary
        if: always()
        env:
          TRIGGER_ACTOR: ${{ github.actor }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          {
            echo "## Deploy database migrations"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Triggered by | ${TRIGGER_ACTOR} |"
            echo "| Trigger Event | ${TRIGGER_EVENT} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Run | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo "| Backup artifact | pre-migration-backup-${{ github.run_id }} |"
            echo "| TypeScript Types | Automatically synchronized to \`types/database.types.ts\` |"
            echo ""
            echo "### Migration state after deploy"
            echo '```'
            cat /tmp/migration_state.txt 2>/dev/null || echo "(verification step did not produce output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send webhook notification
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -n "${WEBHOOK_URL:-}" ]; then
            STATUS="${{ job.status }}"
            curl -s -X POST -H "Content-Type: application/json" \
              -d "{\"text\": \"Deploy database migrations: ${STATUS} on ${{ github.repository }} (Run ${{ github.run_id }})\"}" \
              "$WEBHOOK_URL" || true
          fi
