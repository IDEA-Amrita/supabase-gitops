name: RLS and database security audit

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/rls-security-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-rls-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-rls:
    name: Audit Row Level Security and access policies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Start isolated PostgreSQL test instance
        run: |
          set -euo pipefail
          docker run --name pg-rls-audit -e POSTGRES_PASSWORD=postgres -p 5434:5432 -d postgres:17-alpine
          until docker exec pg-rls-audit pg_isready -U postgres >/dev/null 2>&1 && docker exec pg-rls-audit psql -U postgres -d postgres -c "SELECT 1" >/dev/null 2>&1; do
            sleep 1
          done
          sleep 2
          for i in {1..10}; do
            if docker exec -i pg-rls-audit psql -U postgres -d postgres << 'EOF'
          DO $$
          DECLARE
            r text;
          BEGIN
            FOR r IN SELECT unnest(ARRAY[
              'anon',
              'authenticated',
              'service_role',
              'authenticator',
              'supabase_admin',
              'dashboard_user',
              'supabase_auth_admin',
              'supabase_storage_admin',
              'supabase_functions_admin'
            ]) LOOP
              BEGIN
                EXECUTE format('CREATE ROLE %I NOLOGIN', r);
              EXCEPTION WHEN duplicate_object THEN
                NULL;
              END;
            END LOOP;
            EXECUTE 'ALTER ROLE service_role BYPASSRLS';
            EXECUTE 'ALTER ROLE supabase_admin BYPASSRLS';
          END $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE SCHEMA IF NOT EXISTS graphql;
          EOF
            then
              break
            fi
            sleep 1
          done
          echo "Isolated PostgreSQL audit container ready."

      - name: Apply migrations sequentially
        run: |
          set -euo pipefail
          for f in $(ls supabase/migrations/*.sql 2>/dev/null | sort); do
            [ -e "$f" ] || continue
            echo "Applying: $f"
            docker exec -i pg-rls-audit psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$f"
          done
          echo "All migrations applied."

      - name: Execute active behavioral RLS test suite
        id: behavioral-rls
        run: |
          set -euo pipefail
          echo "Running active role impersonation and cross-tenant isolation tests..."
          docker exec -i pg-rls-audit psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/audit_rls_behavior.sql
          echo "Behavioral RLS test suite completed successfully."

      - name: Audit Row Level Security compliance
        id: rls-check
        run: |
          set -euo pipefail

          UNPROTECTED_TABLES=$(docker exec pg-rls-audit psql -U postgres -d postgres -At -c \
            "SELECT tablename FROM pg_tables WHERE schemaname = 'public' AND rowsecurity = false ORDER BY tablename;")

          ZERO_POLICY_TABLES=$(docker exec pg-rls-audit psql -U postgres -d postgres -At -c \
            "SELECT t.tablename
             FROM pg_tables t
             LEFT JOIN pg_policies p ON t.schemaname = p.schemaname AND t.tablename = p.tablename
             WHERE t.schemaname = 'public' AND t.rowsecurity = true
             GROUP BY t.tablename
             HAVING count(p.policyname) = 0
             ORDER BY t.tablename;")

          POLICIES_REPORT=$(docker exec pg-rls-audit psql -U postgres -d postgres -At -c \
            "SELECT t.tablename || ' | ' || CASE WHEN t.rowsecurity THEN 'ENABLED' ELSE 'DISABLED' END || ' | ' || count(p.policyname)
             FROM pg_tables t
             LEFT JOIN pg_policies p ON t.schemaname = p.schemaname AND t.tablename = p.tablename
             WHERE t.schemaname = 'public'
             GROUP BY t.tablename, t.rowsecurity
             ORDER BY t.tablename;")

          PERMISSIVE_WRITES=$(docker exec pg-rls-audit psql -U postgres -d postgres -At -c \
            "SELECT tablename || ': ' || policyname || ' (' || cmd || ')'
             FROM pg_policies
             WHERE schemaname = 'public'
               AND cmd IN ('INSERT', 'UPDATE', 'DELETE', 'ALL')
               AND (qual = 'true' OR with_check = 'true')
             ORDER BY tablename, policyname;")

          echo "Audit table status:"
          printf '%s\n' "$POLICIES_REPORT"

          if [ -n "$ZERO_POLICY_TABLES" ]; then
            echo "::warning::Zero-policy lockout detected! Tables have RLS enabled with 0 policies (locks out all application users):"
            printf '%s\n' "$ZERO_POLICY_TABLES"
          fi

          if [ -n "$PERMISSIVE_WRITES" ]; then
            echo "::warning::Unrestricted permissive write policies found:"
            printf '%s\n' "$PERMISSIVE_WRITES"
          fi

          if [ -n "$UNPROTECTED_TABLES" ]; then
            echo "::error::Security gate failed! The following public tables lack Row Level Security (RLS):"
            printf '%s\n' "$UNPROTECTED_TABLES"
            exit 1
          fi

          echo "RLS enforcement check passed. All public tables have RLS enabled."

          {
            echo "policies_report<<ENDOFVAL"
            echo "$POLICIES_REPORT"
            echo "ENDOFVAL"
            echo "zero_policy_tables<<ENDOFVAL"
            echo "$ZERO_POLICY_TABLES"
            echo "ENDOFVAL"
            echo "permissive_writes<<ENDOFVAL"
            echo "$PERMISSIVE_WRITES"
            echo "ENDOFVAL"
          } >> "$GITHUB_OUTPUT"

      - name: Stop and remove test container
        if: always()
        run: |
          set -euo pipefail
          docker stop pg-rls-audit >/dev/null 2>&1 || true
          docker rm pg-rls-audit >/dev/null 2>&1 || true

      - name: Write audit report to Job Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Row Level Security (RLS) & Behavioral Security Audit"
            echo ""
            if [ "${{ steps.rls-check.conclusion }}" = "success" ]; then
              echo "All public database tables comply with Row Level Security policies."
              echo ""
              echo "| Table Name | RLS Status | Policy Count |"
              echo "|---|---|---|"
              while IFS='|' read -r table status count; do
                [ -z "$table" ] && continue
                echo "| \`$table\` | $status | $count |"
              done <<< "${{ steps.rls-check.outputs.policies_report }}"
              echo ""
              echo "### Active Behavioral Access Verification"
              echo "- **Anonymous Role (\`anon\`)**: Unauthorized writes and restricted reads blocked."
              echo "- **Authenticated Users**: Isolated to owner identity (\`auth.uid() = user_id\`); cross-tenant access prohibited."
              echo "- **Service Role (\`service_role\`)**: Administrative bypass verified for backend operational tasks."
              echo ""
              if [ -n "${{ steps.rls-check.outputs.zero_policy_tables }}" ]; then
                echo "### ⚠️ Zero-Policy Lockout Warning"
                echo "> The following tables have RLS enabled with 0 policies, blocking all non-service_role access:"
                echo '```sql'
                while IFS= read -r zt; do
                  [ -z "$zt" ] && continue
                  echo "-- Remediation for public.$zt:"
                  echo "CREATE POLICY \"Allow authenticated read\" ON public.$zt FOR SELECT TO authenticated USING (true);"
                  echo "CREATE POLICY \"Allow owner modify\" ON public.$zt FOR ALL TO authenticated USING (auth.uid() = user_id);"
                done <<< "${{ steps.rls-check.outputs.zero_policy_tables }}"
                echo '```'
                echo ""
              fi
              if [ -n "${{ steps.rls-check.outputs.permissive_writes }}" ]; then
                echo "### ⚠️ Permissive Write Policies Audit"
                echo "> Warning: The following policies allow unrestricted writes:"
                echo '```'
                echo "${{ steps.rls-check.outputs.permissive_writes }}"
                echo '```'
                echo "**Remediation:** Replace \`USING (true)\` / \`WITH CHECK (true)\` with role-scoped checks (e.g. \`auth.uid() = user_id\`)."
              fi
            else
              echo "**RLS security audit failed.** One or more public tables lack Row Level Security."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
