name: Backup database

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Create encrypted database backup
    if: github.event_name != 'schedule' || vars.ENABLE_ALL_SCHEDULES == 'true' || vars.ENABLE_SCHEDULED_BACKUPS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify tools
        run: |
          set -euo pipefail
          docker pull postgres:17-alpine
          docker run --rm postgres:17-alpine pg_dump --version

      - name: Dump and encrypt database
        id: backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$BACKUP_ENCRYPTION_KEY" ]; then
            echo "::error::No encryption key found. Please configure the 'BACKUP_ENCRYPTION_KEY' secret in repository settings."
            exit 1
          fi

          if [ "${#BACKUP_ENCRYPTION_KEY}" -lt 16 ]; then
            echo "::error::BACKUP_ENCRYPTION_KEY does not meet the minimum length requirement (must be at least 16 characters)."
            exit 1
          fi

          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set."
            exit 1
          fi

          TIMESTAMP=$(date -u +'%Y%m%d_%H%M%S')
          FILE_NAME="supabase_backup_${TIMESTAMP}.sql.gpg"
          BUNDLE_DIR="/tmp/backup_bundle_${TIMESTAMP}"
          mkdir -p "$BUNDLE_DIR"
          OUTPUT_PATH="${BUNDLE_DIR}/${FILE_NAME}"

          echo "Running pg_dump via postgres:17 Docker container and streaming into GPG AES-256 via secure descriptor..."
          docker run --rm \
            postgres:17-alpine \
            pg_dump "$SUPABASE_DB_URL" \
              --schema=public \
              --clean \
              --if-exists \
              --quote-all-identifiers \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase-fd 3 -o "$OUTPUT_PATH" 3<<< "$BACKUP_ENCRYPTION_KEY"

          FILE_SIZE=$(ls -lh "$OUTPUT_PATH" | awk '{print $5}')
          echo "Backup created: $OUTPUT_PATH ($FILE_SIZE)"

          # Generate tamper-evident SHA-256 checksum and audit manifest
          cd "$BUNDLE_DIR"
          SHA256_HASH=$(sha256sum "$FILE_NAME" | awk '{print $1}')
          sha256sum "$FILE_NAME" > "${FILE_NAME}.sha256"

          cat << EOF > manifest.json
          {
            "timestamp": "${TIMESTAMP}",
            "file_name": "${FILE_NAME}",
            "sha256": "${SHA256_HASH}",
            "file_size": "${FILE_SIZE}",
            "commit_sha": "${{ github.sha }}",
            "cipher": "AES-256",
            "scope": "public"
          }
          EOF

          echo "Computed SHA-256: $SHA256_HASH"
          echo "file_name=${FILE_NAME}" >> "$GITHUB_OUTPUT"
          echo "file_path=${OUTPUT_PATH}" >> "$GITHUB_OUTPUT"
          echo "bundle_path=${BUNDLE_DIR}" >> "$GITHUB_OUTPUT"
          echo "file_size=${FILE_SIZE}" >> "$GITHUB_OUTPUT"
          echo "timestamp=${TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256_HASH}" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted backup artifact bundle
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: encrypted-database-backup-${{ steps.backup.outputs.timestamp }}
          path: ${{ steps.backup.outputs.bundle_path }}
          retention-days: 90

      - name: Write job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Database Backup (Application Schema: \`public\`)"
            echo ""
            if [ "${{ steps.backup.conclusion }}" = "success" ]; then
              echo "Encrypted database backup created successfully."
              echo ""
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| Trigger | ${{ github.event_name }} |"
              echo "| Scope | Application schema (\`public\` tables, sequences, triggers, data) |"
              echo "| Excluded | Platform schemas (\`auth\`, \`storage\`, \`vault\`, system catalogs) |"
              echo "| Encryption | AES-256 (GPG symmetric) |"
              echo "| SHA-256 Checksum | \`${{ steps.backup.outputs.sha256 }}\` |"
              echo "| Commit SHA | \`${{ github.sha }}\` |"
              echo "| Timestamp | ${{ steps.backup.outputs.timestamp }} UTC |"
              echo "| Artifact | \`encrypted-database-backup-${{ steps.backup.outputs.timestamp }}\` |"
              echo "| File | \`${{ steps.backup.outputs.file_name }}\` |"
              echo "| Size | ${{ steps.backup.outputs.file_size }} |"
              echo "| Retention | 90 days (GitHub Actions Artifact limit) |"
              echo ""
              echo "### How to restore"
              echo '```bash'
              echo "sha256sum -c ${{ steps.backup.outputs.file_name }}.sha256"
              echo "gpg --decrypt ${{ steps.backup.outputs.file_name }} > rebuild.sql"
              echo "psql \"<TARGET_DATABASE_URL>\" < rebuild.sql"
              echo '```'
            else
              echo "**Backup failed.** Check step logs for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send webhook notification
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -n "${WEBHOOK_URL:-}" ]; then
            STATUS="${{ job.status }}"
            curl -s -X POST -H "Content-Type: application/json" \
              -d "{\"text\": \"Database backup: ${STATUS} on ${{ github.repository }} (Run ${{ github.run_id }})\"}" \
              "$WEBHOOK_URL" || true
          fi


