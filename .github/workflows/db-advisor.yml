name: Database performance and index advisor

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-advisor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-db-advisor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance-audit:
    name: Audit schema performance, indexes, and constraints
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.121.0

      - name: Start isolated PostgreSQL test container
        run: |
          set -euo pipefail
          chmod +x scripts/init_test_pg.sh
          ./scripts/init_test_pg.sh pg-advisor-target 5435

      - name: Apply migrations sequentially
        run: |
          set -euo pipefail
          for f in $(ls supabase/migrations/*.sql 2>/dev/null | sort); do
            [ -e "$f" ] || continue
            echo "Applying: $f"
            docker exec -i pg-advisor-target psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$f"
          done
          echo "All migrations applied successfully."

      - name: Run index and schema performance advisor
        id: advisor
        run: |
          set -euo pipefail

          MISSING_PKS=$(docker exec pg-advisor-target psql -U postgres -d postgres -At -c \
            "SELECT c.relname
             FROM pg_class c
             JOIN pg_namespace n ON n.oid = c.relnamespace
             WHERE n.nspname = 'public'
               AND c.relkind = 'r'
               AND NOT EXISTS (
                 SELECT 1 FROM pg_constraint con WHERE con.conrelid = c.oid AND con.contype = 'p'
               )
             ORDER BY c.relname;")

          UNINDEXED_FKS=$(docker exec pg-advisor-target psql -U postgres -d postgres -At -c \
            "SELECT c.conrelid::regclass || ' | ' || c.conname || ' | ' || pg_get_constraintdef(c.oid)
             FROM pg_constraint c
             JOIN pg_namespace n ON n.oid = c.connamespace
             WHERE c.contype = 'f'
               AND n.nspname = 'public'
               AND NOT EXISTS (
                 SELECT 1 FROM pg_index i
                 WHERE i.indrelid = c.conrelid
                   AND i.indkey[0:(array_length(c.conkey, 1) - 1)] = c.conkey
               )
             ORDER BY 1;")

          TOTAL_TABLES=$(docker exec pg-advisor-target psql -U postgres -d postgres -At -c \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';")

          TOTAL_INDEXES=$(docker exec pg-advisor-target psql -U postgres -d postgres -At -c \
            "SELECT count(*) FROM pg_stat_user_indexes WHERE schemaname = 'public';")

          echo "Total Public Tables: $TOTAL_TABLES"
          echo "Total Public Indexes: $TOTAL_INDEXES"

          if [ -n "$MISSING_PKS" ]; then
            echo "::warning::Tables missing primary key: $MISSING_PKS"
          fi

          if [ -n "$UNINDEXED_FKS" ]; then
            echo "::warning::Unindexed foreign keys detected: $UNINDEXED_FKS"
          fi

          {
            echo "total_tables=${TOTAL_TABLES}"
            echo "total_indexes=${TOTAL_INDEXES}"
            echo "missing_pks<<ENDOFVAL"
            echo "$MISSING_PKS"
            echo "ENDOFVAL"
            echo "unindexed_fks<<ENDOFVAL"
            echo "$UNINDEXED_FKS"
            echo "ENDOFVAL"
          } >> "$GITHUB_OUTPUT"

      - name: Run Supabase CLI schema lint
        id: cli-lint
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          TARGET_URL="${SUPABASE_DB_URL:-postgresql://postgres:postgres@127.0.0.1:5435/postgres}"
          echo "Running supabase db lint on target database ($([ -n "${SUPABASE_DB_URL:-}" ] && echo "remote secret" || echo "local test container"))..."
          
          LINT_EXIT=0
          LINT_OUTPUT=$(supabase db lint --db-url "$TARGET_URL" --schema public --level warning 2>&1) || LINT_EXIT=$?
          echo "$LINT_OUTPUT"

          if [ "$LINT_EXIT" -ne 0 ] || echo "$LINT_OUTPUT" | grep -qi "ERROR"; then
            echo "::error::Supabase db lint identified schema errors in public schema."
          elif echo "$LINT_OUTPUT" | grep -qi "WARN"; then
            echo "::warning::Supabase db lint identified schema warnings."
          fi

          {
            echo "lint_output<<ENDOFVAL"
            echo "$LINT_OUTPUT"
            echo "ENDOFVAL"
          } >> "$GITHUB_OUTPUT"

      - name: Stop and remove test container
        if: always()
        run: |
          set -euo pipefail
          docker stop pg-advisor-target >/dev/null 2>&1 || true
          docker rm pg-advisor-target >/dev/null 2>&1 || true

      - name: Publish performance advisor report
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Database Performance & Index Advisor Report"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Total Public Tables | ${{ steps.advisor.outputs.total_tables }} |"
            echo "| Total Public Indexes | ${{ steps.advisor.outputs.total_indexes }} |"
            echo "| Tables Missing Primary Key | $([ -z "${{ steps.advisor.outputs.missing_pks }}" ] && echo "0 (Optimal)" || echo "Needs Attention") |"
            echo "| Unindexed Foreign Keys | $([ -z "${{ steps.advisor.outputs.unindexed_fks }}" ] && echo "0 (Optimal)" || echo "Needs Attention") |"
            echo ""
            if [ -n "${{ steps.advisor.outputs.missing_pks }}" ]; then
              echo "### Tables Missing Primary Key"
              echo "> Warning: All relational tables should have a primary key for efficient joins and replication."
              echo '```'
              echo "${{ steps.advisor.outputs.missing_pks }}"
              echo '```'
            fi
            if [ -n "${{ steps.advisor.outputs.unindexed_fks }}" ]; then
              echo "### Unindexed Foreign Keys"
              echo "> Warning: Adding indexes to foreign key columns avoids full table scans during joins and cascade deletions."
              echo '```'
              echo "${{ steps.advisor.outputs.unindexed_fks }}"
              echo '```'
            fi
            echo "### Supabase CLI Lint Output"
            echo '```'
            echo "${{ steps.cli-lint.outputs.lint_output }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
